// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Ensure every native Android library links the shared C++ runtime. The
// generated CMake link lines otherwise omit libc++ for this project.
subprojects { subproject ->
  ['com.android.library', 'com.android.application'].each { pluginId ->
    subproject.plugins.withId(pluginId) {
      def androidExtension = subproject.extensions.findByName('android')
      def cmake = androidExtension?.defaultConfig?.externalNativeBuild?.cmake
      def cxxRuntimeArgument = '-DCMAKE_CXX_STANDARD_LIBRARIES=-lc++_shared -latomic -lm'
      if (cmake != null && !cmake.arguments.any { it.startsWith('-DCMAKE_CXX_STANDARD_LIBRARIES=') }) {
        cmake.arguments.add(cxxRuntimeArgument)
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
